<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="podfetch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="podfetch-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="40" height="40" rx="10" fill="url(#podfetch-grad)" />
  <!-- Inner Subtle Border -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="rgba(255,255,255,0.2)" fill="none" />
  
  <!-- Wave / Antenna Waves (Left & Right) -->
  <path d="M12 16.5C10.8 17.8 10 19.8 10 22C10 24.2 10.8 26.2 12 27.5" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
  <path d="M28 16.5C29.2 17.8 30 19.8 30 22C30 24.2 29.2 26.2 28 27.5" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />

  <!-- Core Stem & Node with Download arrow fusion -->
  <circle cx="20" cy="13" r="3.5" fill="white" />
  <path d="M20 18V26" stroke="white" stroke-width="2.5" stroke-linecap="round" />
  <path d="M16 23L20 27L24 23" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Base Dish Tray -->
  <path d="M15 30H25" stroke="url(#podfetch-accent)" stroke-width="2.5" stroke-linecap="round" />
</svg>
